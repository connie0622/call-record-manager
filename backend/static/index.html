<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Call Record Manager - Upload</title>
  </head>
  <body>
    <h1>Upload Call Recording</h1>
    <form id="uploadForm" action="/calls/upload" method="post" enctype="multipart/form-data">
      <label>Customer: <input type="text" name="customer" /></label><br/><br/>
      <label>File: <input type="file" name="file" accept=".mp3,.mp4,.wav,.m4a" /></label><br/><br/>
      <button type="submit">Upload</button>
    </form>
    <pre id="result"></pre>

    <script>
      document.getElementById('uploadForm').addEventListener('submit', async function(e){
        e.preventDefault();
        const form = e.target;
        const data = new FormData(form);
        const resultEl = document.getElementById('result');
        try {
          const resp = await fetch('/calls/upload', {method:'POST', body: data});
          const json = await resp.json();
          resultEl.textContent = JSON.stringify(json, null, 2);
        } catch (err) {
          resultEl.textContent = 'Upload failed: ' + err;
        }
      });
    </script>
  </body>
</html>
